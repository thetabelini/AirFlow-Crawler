# Perfil para VM pequena (1 OCPU, 4 GB de RAM + swap). Ative com uma linha no .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.small.yml
# Quando a VM crescer, apague essa linha e rode "docker compose up -d" de novo.

services:
  postgres:
    mem_limit: 768m

  airflow-apiserver:
    environment:
      # O padrão são 4 processos da API; 1 basta para uma pessoa usando a interface.
      AIRFLOW__API__WORKERS: "1"
    mem_limit: 1g

  airflow-scheduler:
    environment:
      AIRFLOW__CORE__PARALLELISM: "2"
      # Sem Kafka neste perfil: a DAG não cria a task publish.
      KAFKA_BOOTSTRAP_SERVERS: ""
    mem_limit: 2g

  airflow-dag-processor:
    environment:
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      KAFKA_BOOTSTRAP_SERVERS: ""
    mem_limit: 512m

  # Nenhuma DAG usa tasks deferrable; o triggerer só sobe com --profile triggerer.
  airflow-triggerer:
    profiles: ["triggerer"]

  # Kafka, kafka-init, consumidor e Kafka UI juntos pedem uns 2 GB; só sobem com --profile kafka.
  kafka:
    profiles: ["kafka"]

  kafka-init:
    profiles: ["kafka"]

  kafka-ui:
    profiles: ["kafka"]

  consumer:
    profiles: ["kafka"]

  caddy:
    mem_limit: 128m
