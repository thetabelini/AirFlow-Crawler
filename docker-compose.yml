# Plataforma de crawlers: Airflow 3 (LocalExecutor) + PostgreSQL + Caddy em uma única VM.
# Cada projeto em projects/<nome>/ ganha um banco, um pool e uma DAG por fonte.
# Todas as variáveis vêm do arquivo .env (veja .env.example).

# Nome fixo: containers e volumes se chamam airflow-crawler-* em qualquer pasta.
name: airflow-crawler

x-airflow-common: &airflow-common
  build: .
  image: crawlers-airflow:latest
  user: "50000:0"
  # Repassa o .env inteiro: as senhas <PROJETO>_DB_PASSWORD de cada projeto vêm daqui.
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?defina AIRFLOW_DB_PASSWORD no .env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?defina AIRFLOW_FERNET_KEY no .env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina AIRFLOW_JWT_SECRET no .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow
    PROJECTS_DIR: /opt/airflow/projects
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./core:/opt/airflow/core:ro
    - ./projects:/opt/airflow/projects:ro
    - ./plugins:/opt/airflow/plugins:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?defina AIRFLOW_DB_PASSWORD no .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    mem_limit: 2g
    restart: always

  # Cria/atualiza o banco de cada projeto e aplica as migrações pendentes. Roda a cada "up".
  db-init:
    image: postgres:16
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: airflow
      PGPASSWORD: ${AIRFLOW_DB_PASSWORD:?defina AIRFLOW_DB_PASSWORD no .env}
    volumes:
      - ./scripts/db-init.sh:/db-init.sh:ro
      - ./core/sql:/core-sql:ro
      - ./projects:/projects:ro
    entrypoint: ["bash", "/db-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow-common
    # O entrypoint da imagem migra o banco do Airflow e cria o admin; depois, um pool por projeto.
    command:
      - bash
      - -c
      - |
        airflow version
        for dir in /opt/airflow/projects/*/; do
          [ -f "$${dir}sources.yaml" ] || continue
          project=$$(basename "$$dir")
          airflow pools set "$$project" 2 "crawlers do projeto $$project"
        done
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?defina AIRFLOW_ADMIN_PASSWORD no .env}
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # Só localhost: o acesso externo passa pelo Caddy.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Com LocalExecutor as tasks (inclusive o Chromium) rodam neste container.
    mem_limit: 8g
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Tela e API de leitura dos dados (https://dados.<DOMAIN>), com usuário só de leitura no banco.
  web:
    build: web
    image: crawlers-web:latest
    environment:
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?defina WEB_DB_PASSWORD no .env}
      WEB_USERS: ${WEB_USERS:-}
      WEB_PUBLIC: ${WEB_PUBLIC:-false}
      PROJECTS_DIR: /app/projects
    volumes:
      - ./web:/app/web:ro
      - ./core:/app/core:ro
      - ./projects:/app/projects:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    # Monta a pasta (não o arquivo) e usa --watch: depois de um git pull que mude o
    # Caddyfile, o Caddy recarrega sozinho, sem precisar recriar o container.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    restart: always
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres-data:
  airflow-logs:
  caddy-data:
  caddy-config:
